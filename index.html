<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./assets/css/style.css">
    </head>
    <body>
        <header>
                <h1>Los Simpsons</h1>
        </header>
        <main>
            <nav>
                <form class="form-inline">
                    <input class="form-control mr-sm-2" type="search" placeholder="Homer Simpson" aria-label="Search" id="buscadorPjs">
                    <button class="btn btn-outline-success my-2 my-sm-0" type="submit" id="botonBuscar">Buscar personaje</button>
                </form>
            </nav>
            <div class="container">
                <div class="row" id="rowContainer"></div>
            </div>
            <div class="modal fade" id="modalDetalle" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalNombre"></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body text-center">
                            <img id="modalImg" src="" alt="" class="img-fluid mb-3" style="max-height: 250px"/>
                            <p><strong>Edad:</strong><span id="modalEdad"></span></p>
                            <p><strong>Fecha de nacimiento:</strong><span id="modalFNacimiento"></span></p>
                            <p><strong>Género:</strong> <span id="modalGenero"></span></p>
                            <p><strong>Ocupación:</strong> <span id="modalOcupacion"></span></p>
                            <p><strong>Estado:</strong> <span id="modalEstado"></span></p>
                            <p><em id="modalFrase"></em></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./assets/js/app.js"></script>
    </body>
</html>
